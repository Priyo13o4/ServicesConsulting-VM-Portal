# Dev and prod servers. Same files on both; each server has its own .env.deploy.
services:
  migrate:
    env_file: .env.deploy

  app:
    env_file: .env.deploy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
